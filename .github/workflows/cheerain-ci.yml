name: CheeRain CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # フロントエンド（Next.js）のテスト
  frontend-test:
    name: Frontend Tests (Next.js + Jest)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: cheerain/package-lock.json

    - name: Install dependencies
      working-directory: ./cheerain
      run: npm ci

    - name: Run ESLint
      working-directory: ./cheerain
      run: npm run lint
      continue-on-error: true

    - name: Run Unit Tests
      working-directory: ./cheerain
      run: npm test -- --passWithNoTests

    - name: Run Tests with Coverage
      working-directory: ./cheerain
      run: npm run test:coverage -- --passWithNoTests

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        files: ./cheerain/coverage/lcov.info
        flags: frontend
        name: frontend-coverage
      continue-on-error: true

  # バックエンド（Spring Boot）のテスト
  backend-test:
    name: Backend Tests (Spring Boot + JUnit)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java-version: [17]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Java ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      working-directory: ./cheerain/backend
      run: ./mvnw clean install -DskipTests

    - name: Run Unit Tests
      working-directory: ./cheerain/backend
      run: ./mvnw test

    - name: Generate Test Report
      working-directory: ./cheerain/backend
      run: ./mvnw surefire-report:report
      if: always()

    - name: Upload Test Results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: backend-test-results
        path: cheerain/backend/target/surefire-reports/

  # E2Eテスト（Playwright）
  e2e-test:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: cheerain/package-lock.json

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'
        cache: maven

    - name: Install frontend dependencies
      working-directory: ./cheerain
      run: npm ci

    - name: Install Playwright browsers
      working-directory: ./cheerain
      run: npx playwright install --with-deps chromium

    - name: Start Backend (Spring Boot)
      working-directory: ./cheerain/backend
      run: |
        ./mvnw spring-boot:run &
        echo $! > backend.pid
        # Wait for backend to be ready
        for i in {1..30}; do
          if curl -f http://localhost:8080/actuator/health > /dev/null 2>&1; then
            echo "Backend is ready!"
            break
          fi
          echo "Waiting for backend... ($i/30)"
          sleep 2
        done
      env:
        SPRING_PROFILES_ACTIVE: test

    - name: Run E2E Tests
      working-directory: ./cheerain
      run: npm run test:e2e -- --project=chromium
      env:
        BASE_URL: http://localhost:3000

    - name: Upload Playwright Report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: playwright-report
        path: cheerain/playwright-report/
        retention-days: 7

    - name: Stop Backend
      if: always()
      working-directory: ./cheerain/backend
      run: |
        if [ -f backend.pid ]; then
          kill $(cat backend.pid) || true
          rm backend.pid
        fi

  # ビルドチェック
  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [frontend-test, backend-test]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: cheerain/package-lock.json

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'
        cache: maven

    - name: Install frontend dependencies
      working-directory: ./cheerain
      run: npm ci

    - name: Build Frontend
      working-directory: ./cheerain
      run: npm run build

    - name: Build Backend JAR
      working-directory: ./cheerain/backend
      run: ./mvnw clean package -DskipTests

    - name: Upload Backend JAR
      uses: actions/upload-artifact@v3
      with:
        name: backend-jar
        path: cheerain/backend/target/*.jar
